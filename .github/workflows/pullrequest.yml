name: Pull Request
on:
  workflow_dispatch:
jobs:
  build_jvm:
    runs-on: '${{ matrix.runner }}'
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 20
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-20-arm64
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: "temurin"
          # Temurin ships no native Windows/aarch64 build of JDK 8; use the x64 build,
          # which runs on windows-11-arm through the built-in x64 emulation.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 8) && 'x64' || '' }}
    - uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - run: mvn --no-transfer-progress --batch-mode verify -P jvmtestsonly
    name: build_jvm [${{ matrix.expander_leg }}]
    timeout-minutes: 150
